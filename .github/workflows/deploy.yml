# Build on push to main and deploy to floza.dev production on this VPS.
# Requires the self-hosted runner labeled `deploy` (see ~/github-runners/floza.dev).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, deploy, linux, x64]
    env:
      DEPLOY_PATH: /home/floza/apps/floza.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to app directory
        run: |
          set -euo pipefail
          mkdir -p "${DEPLOY_PATH}/.next/static" "${DEPLOY_PATH}/public"
          rsync -a --delete .next/standalone/ "${DEPLOY_PATH}/"
          rsync -a --delete .next/static/ "${DEPLOY_PATH}/.next/static/"
          rsync -a --delete public/ "${DEPLOY_PATH}/public/"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user restart floza-dev
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3005/; then
              curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:3005/
              exit 0
            fi
            sleep 1
          done
          echo "floza-dev did not become ready on :3005" >&2
          exit 1